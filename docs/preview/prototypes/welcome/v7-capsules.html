<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>V7 立体斜置胶囊</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(110% 80% at 50% 40%,#0a0f22 0%,#04050a 72%);
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#f4f4f7;
  display:flex;align-items:center;justify-content:center}

/* ---- 斜置胶囊群（整体倾斜，个体只变高度） ---- */
.blobs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  transform:rotate(-9deg);pointer-events:none}
.blob{flex:none;margin:0 -12px;border-radius:999px;transform:translateY(var(--dy));
  background:
    /* 柱面高光：偏左上的一条竖向亮带 */
    radial-gradient(40% 52% at 32% 30%, rgba(255,255,255,.26), rgba(255,255,255,0) 74%),
    /* 顶部白色泛光 */
    radial-gradient(70% 26% at 50% 4%, rgba(255,255,255,.65), rgba(255,255,255,0) 72%),
    /* 横向明暗 = 圆柱感 */
    linear-gradient(96deg,
      #1d3aa8 0%, #2f63e6 14%, #5aa8ff 30%, #a9e6ff 42%,
      #6f9bff 58%, #5b4bff 78%, #3b1fa0 100%),
    linear-gradient(180deg, #7fd4ff 0%, #5a8cff 52%, #8a5cff 100%);
  box-shadow:
    0 34px 70px rgba(40,70,200,.38),
    0 0 46px rgba(90,140,255,.28),
    inset 8px 0 18px rgba(255,255,255,.22),
    inset -14px 0 26px rgba(24,8,90,.55);
  filter:blur(.35px);opacity:var(--op)}
.b1{width:86px;height:238px;--dy:-4px;--op:.72}
.b2{width:94px;height:300px;--dy:-18px;--op:.9}
.b3{width:100px;height:352px;--dy:-34px;--op:1}
.b4{width:84px;height:248px;--dy:0px;--op:.8}
.b5{width:96px;height:318px;--dy:-22px;--op:.95}
.b6{width:80px;height:216px;--dy:10px;--op:.66}
.b7{width:98px;height:338px;--dy:-28px;--op:.98}
.b8{width:88px;height:262px;--dy:4px;--op:.7}
.b9{width:102px;height:320px;--dy:-24px;--op:.92}

/* ---- 玻璃条 ---- */
.stage{position:relative;z-index:2;width:min(820px,62vw)}
.bar{height:150px;display:flex;align-items:center;gap:24px;padding:0 36px;
  background:linear-gradient(180deg, rgba(9,9,16,.46) 0%, rgba(5,5,10,.62) 100%);
  backdrop-filter:blur(22px) saturate(145%) brightness(.95);
  -webkit-backdrop-filter:blur(22px) saturate(145%) brightness(.95);
  border-top:1px solid rgba(255,255,255,.15);
  border-bottom:1px solid rgba(255,255,255,.06);
  box-shadow:0 30px 90px rgba(0,0,0,.55);
  transition:opacity .3s ease, transform .3s ease}
.bar svg{width:52px;height:52px;flex:none;filter:drop-shadow(0 0 16px rgba(150,160,255,.6))}
.bar .txt{font-size:16px;letter-spacing:.4px;color:#f3f3f9;font-weight:500}
.bar .txt b{color:#ff8364;font-weight:600}

.login{margin:24px 0 0 36px;font-size:12.5px;color:#c8c8d4;letter-spacing:1.2px;
  background:none;border:0;border-bottom:1px solid rgba(255,255,255,.24);padding:3px 1px;cursor:pointer;
  transition:color .2s,border-color .2s}
.login:hover{color:#fff;border-color:#fff}

/* ---- 登录卡 ---- */
.qcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);
  width:322px;padding:22px;border-radius:26px;text-align:center;
  background:linear-gradient(180deg, rgba(26,26,40,.42), rgba(12,12,20,.55));
  backdrop-filter:blur(30px) saturate(160%);
  -webkit-backdrop-filter:blur(30px) saturate(160%);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 40px 110px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.15);
  opacity:0;pointer-events:none;transition:opacity .34s ease, transform .34s cubic-bezier(.2,.85,.25,1)}
.qr{background:#fff;border-radius:16px;padding:10px;aspect-ratio:1}
.qr img{width:100%;height:100%;display:block;object-fit:contain}
.cap{margin-top:16px;font-size:11.5px;color:#a6a6b6;letter-spacing:.5px}

body.signin .bar,body.signin .login{opacity:0;transform:scale(.985);pointer-events:none}
body.signin .qcard{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
</style></head>
<body>
<div class="blobs">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div class="blob b5"></div><div class="blob b6"></div><div class="blob b7"></div>
  <div class="blob b8"></div><div class="blob b9"></div>

      <rect x="37" y="30" width="6" height="6" rx="1" fill="#a9e6ff" opacity=".55"/>
    </svg>
    <div class="txt">更快、更易、更强的 DeepFake 工作流　<b>PyTorch</b></div>
