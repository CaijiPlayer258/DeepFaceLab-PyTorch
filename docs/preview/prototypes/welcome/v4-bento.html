<!doctype html>

<style>
:root{--bg:#0a0a0c;--ink:#f2f2f5;--ink2:#8f8f9b;--ink3:#63636e;--line:#1d1d24;--brand:#6d79e0;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo{display:flex;align-items:center;gap:9px}
.mark{width:26px;height:26px}
.mono{font-family:ui-monospace,Menlo,monospace}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

.wrap{width:1060px;display:grid;grid-template-columns:1.35fr .65fr;grid-template-rows:auto auto;gap:14px}
.big{grid-row:span 2;padding:38px;background:#101015;border:1px solid #1d1d25;border-radius:20px;display:flex;flex-direction:column}
h1{font-size:40px;line-height:1.18;letter-spacing:-.6px;font-weight:800;margin-top:28px}
.sub{margin-top:14px;font-size:13px;color:#75757f;line-height:1.85;max-width:380px}
.big .cta{margin-top:auto;display:flex;gap:10px}
.pri{background:var(--brand);color:#fff;border-radius:10px;padding:11px 20px;font-size:13px;font-weight:600}
.ghost{font-size:12px;color:#8b8b96;padding:11px 12px}
.small{padding:22px;background:#0f0f13;border:1px solid #1c1c23;border-radius:20px;display:flex;align-items:center;gap:18px}
.small .k{font-size:11px;color:#63636e;letter-spacing:.06em}
.small .v{font-size:26px;font-weight:700;margin-top:6px}
.small .s{font-size:11px;color:#63636e;margin-top:4px}

</style></head>
