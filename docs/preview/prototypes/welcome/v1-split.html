<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>V1 左文右码</title>
<style>
:root{--bg:#0a0a0c;--ink:#f2f2f5;--ink2:#8f8f9b;--ink3:#63636e;--line:#1d1d24;--brand:#6d79e0;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo{display:flex;align-items:center;gap:9px}
.mark{width:26px;height:26px}
.mono{font-family:ui-monospace,Menlo,monospace}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

.wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:72px;align-items:center;width:1060px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:34px}
.brand span{font-size:12.5px;color:#8b8b96;letter-spacing:.04em}
h1{font-size:42px;line-height:1.2;font-weight:800;letter-spacing:-.6px}
.sub{margin-top:16px;font-size:13px;line-height:1.85;color:#77777f;max-width:380px}
.rows{margin-top:36px}
.row{display:flex;gap:16px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row b{font-size:16px;letter-spacing:2px;width:56px;flex:none}
.row span{font-size:12px;color:#6b6b76}
.card{width:344px;padding:22px;background:#101014;border:1px solid #1e1e25;border-radius:18px}
.card b{display:block;margin-top:16px;font-size:13px}
.card p{margin:6px 0 14px;font-size:11.5px;color:#6f6f7a;line-height:1.7}
.skip{font-size:11.5px;color:#8b8b96;border:1px solid #24242c;border-radius:8px;padding:7px 12px;background:#15151a}

</style></head>
