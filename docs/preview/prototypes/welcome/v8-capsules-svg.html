html,body{height:100%;overflow:hidden}
body{background:#04050a;font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#f4f4f7;
  display:flex;align-items:center;justify-content:center;position:relative}
.field{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.field svg{width:980px;height:auto;transform:rotate(-10deg);filter:blur(.4px)}
.stage{position:relative;z-index:2;width:min(820px,62vw)}
.bar{height:150px;display:flex;align-items:center;gap:24px;padding:0 36px;
  background:linear-gradient(180deg, rgba(10,10,18,.42) 0%, rgba(6,6,12,.58) 100%);
  backdrop-filter:blur(22px) saturate(150%) brightness(.95);
  -webkit-backdrop-filter:blur(22px) saturate(150%) brightness(.95);
  border-top:1px solid rgba(255,255,255,.15);
  border-bottom:1px solid rgba(255,255,255,.06);
  box-shadow:0 30px 90px rgba(0,0,0,.55);
  transition:opacity .3s ease, transform .3s ease}
.bar svg.logo{width:52px;height:52px;flex:none;filter:drop-shadow(0 0 16px rgba(150,160,255,.6))}
.bar .txt{font-size:16px;letter-spacing:.4px;color:#f3f3f9;font-weight:500}
.bar .txt b{color:#ff8364;font-weight:600}
.login{margin:24px 0 0 36px;font-size:12.5px;color:#c8c8d4;letter-spacing:1.2px;background:none;border:0;
  border-bottom:1px solid rgba(255,255,255,.24);padding:3px 1px;cursor:pointer;transition:color .2s,border-color .2s}
.login:hover{color:#fff;border-color:#fff}
.qcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);width:322px;padding:22px;
  border-radius:26px;text-align:center;
  background:linear-gradient(180deg, rgba(26,26,40,.42), rgba(12,12,20,.55));
  backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 40px 110px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.15);
  opacity:0;pointer-events:none;transition:opacity .34s ease, transform .34s cubic-bezier(.2,.85,.25,1)}
.qr{background:#fff;border-radius:16px;padding:10px;aspect-ratio:1}
.qr img{width:100%;height:100%;display:block;object-fit:contain}
.cap{margin-top:16px;font-size:11.5px;color:#a6a6b6;letter-spacing:.5px}
body.signin .bar,body.signin .login{opacity:0;transform:scale(.985);pointer-events:none}
body.signin .qcard{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
