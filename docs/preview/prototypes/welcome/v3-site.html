<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>V3 官网式</title>
<style>
:root{--bg:#0a0a0c;--ink:#f2f2f5;--ink2:#8f8f9b;--ink3:#63636e;--line:#1d1d24;--brand:#6d79e0;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo{display:flex;align-items:center;gap:9px}
.mark{width:26px;height:26px}
.mono{font-family:ui-monospace,Menlo,monospace}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

body{display:block;overflow:hidden}
.nav{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;padding:0 40px;gap:10px;
  border-bottom:1px solid #16161c}
.nav .sp{flex:1}
.nav a{font-size:12px;color:#7a7a85;margin-right:26px;text-decoration:none}
.nav .btn{font-size:12px;border:1px solid #26262f;border-radius:8px;padding:7px 14px;color:#cfcfd6}
.hero{padding:150px 40px 0;max-width:1180px;margin:0 auto}
h1{font-size:58px;line-height:1.12;letter-spacing:-1.6px;font-weight:800;max-width:760px}
.sub{margin-top:20px;font-size:14px;color:#7b7b86;max-width:520px;line-height:1.85}
.cta{margin-top:34px;display:flex;gap:12px;align-items:center}
.cta .pri{background:var(--brand);color:#fff;border-radius:10px;padding:11px 22px;font-size:13px;font-weight:600}
.cta .ghost{font-size:12px;color:#8b8b96}
.strip{position:absolute;left:0;right:0;bottom:74px;display:flex;gap:64px;padding:0 40px;max-width:1180px;margin:0 auto}
.stat b{display:block;font-size:30px;font-weight:700;letter-spacing:-.5px}
.stat span{display:block;margin-top:8px;font-size:12px;color:#63636e}
.qr{position:fixed;right:56px;bottom:96px;padding:16px;background:#0f0f13;border:1px solid #1d1d24;border-radius:16px}
.qr p{margin-top:10px;font-size:11px;color:#6b6b76;text-align:center}

</style></head>
<body>
<div class="nav">
  <div class="logo"><svg class="mark" viewBox="0 0 32 32" fill="none"><rect x="1" y="1" width="30" height="30" rx="8" fill="#15151c" stroke="#2a2a36"/><path d="M10 10h6a4 4 0 1 1 0 8h-6z" stroke="#8b93ff" stroke-width="2.2" stroke-linejoin="round"/><path d="M10 18h3v4" stroke="#8b93ff" stroke-width="2.2" stroke-linecap="round"/></svg></div><span style="font-size:12.5px;color:#8b8b96">DeepFaceLab-PyTorch</span>
  <div class="sp"></div>
  <a>提取</a><a>处理</a><a>训练</a><a>合成</a>
  <div class="btn">扫码登录</div>
</div>
<div class="hero">
  <h1>本地跑完整个<br>换脸工作流</h1>
  <p class="sub">提取、处理、训练、合成四步都在同一个窗口里完成，不用记命令，数据不出本机。</p>
  <div class="cta"><button class="pri">开始使用</button><span class="ghost">或扫码登录获取高码率素材</span></div>
</div>
<div class="strip">
  <div class="stat"><b class="mono">62–72</b><span>张/秒 提取速度</span></div>
  <div class="stat"><b class="mono">0.02%</b><span>错脸检测误报</span></div>
  <div class="stat"><b class="mono">4</b><span>步走完流程</span></div>
  <div class="stat"><b class="mono">3</b><span>个模型引擎即开即用</span></div>
</div>
