<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8">
<title>模型转换 · 动效 v14</title>
<style>
:root{
  --bg:#08080a; --panel:#141418; --panel-2:#1a1a1f; --line:#26262d;
  --ink:#f2f2f4; --ink-2:#a3a3ad; --ink-3:#6d6d78;
  --brand:#5d6ccf; --surface-hover:#232329;
  --ok:#3ddc84; --bad:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 36px rgba(0,0,0,.55);
  --font:"Inter","Noto Sans SC","Source Han Sans SC","Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;
  display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}

.card{width:560px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px;box-shadow:var(--shadow);transition:border-color .35s ease, box-shadow .35s ease}
.card.bad{border-color:rgba(248,113,113,.45);box-shadow:0 0 0 1px rgba(248,113,113,.10),0 12px 36px rgba(0,0,0,.55)}

.hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hd b{font-size:13px;font-weight:600}
.hd .meta{font-size:12px;color:var(--ink-3)}
.spacer{flex:1}
.badge{font-size:12px;color:var(--bad);opacity:0;transition:opacity .25s ease}
.badge.on{opacity:1}

.step{position:relative;padding:8px 0}
.step-head{display:flex;gap:12px;align-items:center}
.ic{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:11px;background:var(--panel-2);color:var(--ink-3);z-index:1;
  transition:background .2s,color .2s,box-shadow .25s}
.step.on .ic{background:rgba(93,108,207,.18);color:#a8b3ee;box-shadow:0 0 0 3px rgba(93,108,207,.12)}
.step.done .ic{background:rgba(61,220,132,.14);color:var(--ok)}
.step.err .ic{background:rgba(248,113,113,.16);color:var(--bad);box-shadow:0 0 0 3px rgba(248,113,113,.12)}
.ic svg{width:12px;height:12px;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.name{font-size:12.5px;color:var(--ink-2);transition:color .2s}
.step.on .name{color:var(--ink)}
.step.err .name{color:var(--bad)}

.dot-line{position:absolute;left:10.5px;top:30px;bottom:-6px;width:1px;background:var(--line)}
.step:last-child .dot-line{display:none}
.dot-line > i{position:absolute;inset:0;background:var(--ok);transform-origin:top;
  transform:scaleY(0);transition:transform 380ms var(--ease-out)}
.step.done .dot-line > i{transform:scaleY(1)}

.panel{display:grid;grid-template-rows:0fr;opacity:0;margin-left:34px;
  transition:grid-template-rows 320ms var(--ease-out), opacity .24s ease}
.step.open .panel{grid-template-rows:1fr;opacity:1;margin-top:8px}
.panel > div{overflow:hidden}
.rows{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px;font-size:12px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .n{font-family:var(--mono);flex:1;min-width:0;color:var(--ink-2)}
.row .c{font-variant-numeric:tabular-nums;color:var(--ink-3);min-width:62px;text-align:right}
.mk{width:12px;text-align:center;color:var(--ink-3)}
.row.run{background:rgba(93,108,207,.08)}
.row.run .n{color:var(--ink)} .row.run .c{color:#a8b3ee}
.row.ok .mk,.row.ok .c{color:var(--ok)}
.row.bad{background:rgba(248,113,113,.08)}
.row.bad .mk,.row.bad .c,.row.bad .n{color:var(--bad)}
.reason{flex:0 0 100%;padding:1px 0 5px 22px;color:var(--bad);opacity:.85;
  font-family:var(--mono);font-size:11px;line-height:1.65;word-break:break-word}

@keyframes shake{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-4px)} 30%{transform:translateX(4px)}
  45%{transform:translateX(-3px)} 60%{transform:translateX(3px)}
  75%{transform:translateX(-2px)} 90%{transform:translateX(1px)}
}
.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97) both}
@media (prefers-reduced-motion: reduce){ *{transition-duration:.01ms!important;animation-duration:.01ms!important} }
</style></head>
<body>
<div class="card" id="card">
  <div class="hd"><b>model</b><span class="meta">liae-ud · 384</span>
    <div class="spacer"></div><span class="badge" id="badge">失败</span></div>

  <div class="step" id="s1">
    <div class="dot-line"><i></i></div>
    <div class="step-head"><div class="ic" id="i1">1</div><div class="name">加载模块</div></div>
    <div class="panel"><div><div class="rows" id="rows1"></div></div></div>
  </div>
  <div class="step" id="s2">
    <div class="dot-line"><i></i></div>
    <div class="step-head"><div class="ic" id="i2">2</div><div class="name">转换模型</div></div>
    <div class="panel"><div><div class="rows" id="rows2"></div></div></div>
  </div>
  <div class="step" id="s3">
    <div class="step-head"><div class="ic" id="i3">3</div><div class="name">完成</div></div>
  </div>
</div>

<script>
var MODS = [{n:"encoder",total:32},{n:"inter_AB",total:8},{n:"inter_B",total:8},{n:"decoder",total:24}];
var el = function (id) { return document.getElementById(id); };
var SPIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>';

var timers = [], nextFail = false;
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function clearAll() { timers.forEach(clearTimeout); timers = []; }

function setStep(i, cls, mark) { el("s" + i).className = "step " + (cls || ""); el("i" + i).innerHTML = mark; }
function buildRows(host) {
  host.innerHTML = "";
  return MODS.map(function (m) {
    var r = document.createElement("div");
    r.className = "row";
    r.innerHTML = '<span class="mk">·</span><span class="n">' + m.n + '</span>' +
                  '<span class="c">' + m.total + ' 项</span>';
    host.appendChild(r);
    return r;
  });
}

function run() {
  clearAll();
  var willFail = nextFail;
  nextFail = !nextFail;

  el("card").classList.remove("bad");
  el("badge").classList.remove("on");
  [1, 2, 3].forEach(function (i) { setStep(i, "", String(i)); });
  el("rows1").innerHTML = "";
  el("rows2").innerHTML = "";

  var r1 = buildRows(el("rows1"));
  var r2 = buildRows(el("rows2"));

  /* 1 加载 */
  later(function () { el("s1").classList.add("on", "open"); el("i1").innerHTML = SPIN; }, 100);
  MODS.forEach(function (m, i) {
    later(function () {
      r1[i].classList.add("run");
      r1[i].querySelector(".mk").textContent = "›";
    }, 340 + i * 210);
    later(function () {
      r1[i].className = "row ok";
      r1[i].querySelector(".mk").textContent = "✓";
    }, 340 + i * 210 + 180);
  });
  var endLoad = 340 + MODS.length * 210 + 180;
  later(function () { setStep(1, "done", "✓"); }, endLoad);
  later(function () { el("s1").classList.remove("open"); }, endLoad + 300);

  /* 2 转换 */
  later(function () { el("s2").classList.add("on", "open"); el("i2").innerHTML = SPIN; }, endLoad + 380);

  var done = 0, failed = false;
  MODS.forEach(function (m, i) {
    var st = endLoad + 640 + i * 620;
    var failHere = willFail && i === 1;

    later(function () {
      if (failed) return;
      r2[i].classList.add("run");
      r2[i].querySelector(".mk").textContent = "›";
    }, st);

    if (!failHere) {
      [1, 2, 3].forEach(function (k) {
        later(function () {
          if (failed) return;
          r2[i].querySelector(".c").textContent = Math.round(m.total * k / 3) + " 项";
        }, st + k * 170);
      });
    }

    later(function () {
      if (failed) return;
      if (failHere) {
        failed = true;
        r2[i].className = "row bad";
        r2[i].querySelector(".mk").textContent = "!";
        r2[i].querySelector(".c").textContent = "形状不符";
        var why = document.createElement("div");
        why.className = "reason";
        why.textContent = "conv_out：源 (5,5,128,128) ≠ 目标 (128,128,5,5) —— 该层布局未转换";
        r2[i].appendChild(why);
        r2[i].classList.add("shake");
        setTimeout(function () { r2[i].classList.remove("shake"); }, 460);

        setStep(2, "err open", "!");
        el("card").classList.add("bad");
        el("badge").classList.add("on");
        return;
      }
      done += m.total;
      r2[i].className = "row ok";
      r2[i].querySelector(".mk").textContent = "✓";
      r2[i].querySelector(".c").textContent = m.total + " 项";
    }, st + 520);
  });

  if (willFail) {
    later(function () { run(); }, endLoad + 8000);
  } else {
    var endConv = endLoad + 640 + MODS.length * 620 + 180;
    later(function () { setStep(2, "done", "✓"); }, endConv);
    later(function () { el("s2").classList.remove("open"); }, endConv + 320);
    later(function () { el("s3").classList.add("on"); el("i3").innerHTML = SPIN; }, endConv + 340);
    later(function () { setStep(3, "done", "✓"); }, endConv + 980);
    later(function () { run(); }, endConv + 3400);
  }
}

run();
</script>
</body></html>
