<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>A2 丝绸折叠</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#04050a;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .tag{position:fixed;left:16px;bottom:14px;color:#4a4a58;letter-spacing:.06em;
    font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif}
</style></head>
<body>
<canvas id="gl"></canvas>
<div class="tag">A2 丝绸折叠</div>
<script>
(function () {
  var canvas = document.getElementById("gl");
  var gl = canvas.getContext("webgl", { antialias: false, alpha: false });
  if (!gl) { document.body.style.background = "#0a1020"; return; }

  var VS = "attribute vec2 aPos; varying vec2 vUv;\n" +
    "void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }";

  var FS =
    "precision highp float;\n" +
    "uniform float uTime;\n" +
    "uniform vec2 uRes;\n" +
    "varying vec2 vUv;\n" +
    "float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }\n" +
    "float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);\n" +
    "  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }\n" +
    "float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.03; a*=0.5; } return v; }\n" +
    "vec2 toP(){ return (vUv - 0.5) * vec2(uRes.x/uRes.y, 1.0); }\n" +
    "float vignette(vec2 p, float k){ return smoothstep(k, 0.05, length(p)); }\n" +
    "float grain(vec2 uv){ return (hash(uv * uRes + uTime) - 0.5) * 0.025; }\n" +
        "void main(){ vec2 p = toP();\n    float t = uTime * 0.06;\n    float q = fbm(p * 0.9 + vec2(t * 0.5, t * 0.2));\n    float fold = sin((p.y * 2.6 + q * 2.2 + t * 1.4)) * 0.5 + 0.5;\n    fold = pow(fold, 2.4);\n\n    float n = fbm(p * 1.6 + vec2(-t * 0.8, q));\n    vec3 deep = vec3(0.06, 0.10, 0.30);\n    vec3 mid  = vec3(0.16, 0.36, 0.95);\n    vec3 hi   = vec3(0.62, 0.90, 1.00);\n    vec3 vio  = vec3(0.55, 0.28, 0.95);\n\n    vec3 col = mix(deep, mid, fold);\n    col = mix(col, hi, pow(fold, 3.0) * 0.55 * (0.4 + n));\n    col = mix(col, vio, smoothstep(0.55, 0.05, vUv.y) * 0.7);\n\n    float a = (0.30 + fold * 0.85) * vignette(p * vec2(0.65, 1.0), 1.15);\n    gl_FragColor = vec4(col * a, a + grain(vUv)); }";


  function compile(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
    return sh;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uTime = gl.getUniformLocation(prog, "uTime");
  var uRes = gl.getUniformLocation(prog, "uRes");

  function resize() {
    var dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    canvas.height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener("resize", resize);
  resize();

  var t0 = performance.now();
  function frame() {
    gl.uniform1f(uTime, (performance.now() - t0) / 1000);
    gl.uniform2f(uRes, canvas.clientWidth, canvas.clientHeight);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body></html>
