<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>A4 体积光束</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#04050a;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .tag{position:fixed;left:16px;bottom:14px;color:#4a4a58;letter-spacing:.06em;
    font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif}
</style></head>
<body>
<canvas id="gl"></canvas>
<div class="tag">A4 体积光束</div>
<script>
(function () {
  var canvas = document.getElementById("gl");
  var gl = canvas.getContext("webgl", { antialias: false, alpha: false });
  if (!gl) { document.body.style.background = "#0a1020"; return; }

  var VS = "attribute vec2 aPos; varying vec2 vUv;\n" +
    "void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }";

  var FS =
    "precision highp float;\n" +
    "uniform float uTime;\n" +
    "uniform vec2 uRes;\n" +
    "varying vec2 vUv;\n" +
    "float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }\n" +
    "float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);\n" +
    "  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }\n" +
    "float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.03; a*=0.5; } return v; }\n" +
    "vec2 toP(){ return (vUv - 0.5) * vec2(uRes.x/uRes.y, 1.0); }\n" +
    "float vignette(vec2 p, float k){ return smoothstep(k, 0.05, length(p)); }\n" +
    "float grain(vec2 uv){ return (hash(uv * uRes + uTime) - 0.5) * 0.025; }\n" +
        "void main(){ vec2 p = toP();\n    float t = uTime * 0.05;\n    float ang = atan(p.x, p.y + 1.35);\n    float sway = fbm(vec2(ang * 1.6 + t, p.y * 0.6 - t)) - 0.5;\n    float beams = pow(abs(sin(ang * 5.2 + sway * 2.4)), 6.0);\n\n    float veil = fbm(vec2(p.x * 1.5 + t * 0.6, p.y * 0.9 - t * 0.3));\n    vec3 cyan = vec3(0.50, 0.92, 1.00);\n    vec3 blue = vec3(0.10, 0.36, 1.00);\n    vec3 vio  = vec3(0.55, 0.26, 0.95);\n\n    vec3 col = mix(blue, cyan, beams * 0.9 + 0.15);\n    col = mix(col, vio, smoothstep(0.7, 0.0, vUv.y) * 0.8);\n    col *= 0.35 + beams * 1.5 + veil * 0.25;\n\n    float a = (beams * 0.75 + veil * 0.18) * smoothstep(0.0, 0.35, vUv.y);\n    a *= vignette(p * vec2(0.9, 1.1), 1.1);\n    gl_FragColor = vec4(col * a, a + grain(vUv)); }";


  function compile(type, src) {
    var sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
    return sh;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var uTime = gl.getUniformLocation(prog, "uTime");
  var uRes = gl.getUniformLocation(prog, "uRes");

  function resize() {
    var dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    canvas.height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener("resize", resize);
  resize();

  var t0 = performance.now();
  function frame() {
    gl.uniform1f(uTime, (performance.now() - t0) / 1000);
    gl.uniform2f(uRes, canvas.clientWidth, canvas.clientHeight);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body></html>
