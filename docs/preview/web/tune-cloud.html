<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>云 · 调参台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#04050a;overflow:hidden;
    font:12.5px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#d8d8e2}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .panel{position:fixed;right:18px;top:18px;width:250px;padding:14px 16px;border-radius:12px;
    background:rgba(10,12,20,.78);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.09)}
  .panel h2{font-size:12px;font-weight:600;letter-spacing:.08em;color:#8f8fa6;margin-bottom:10px}
  label{display:block;margin-bottom:9px}
  label span{display:flex;justify-content:space-between;color:#9a9ab0;margin-bottom:3px;font-size:11.5px}
  label b{color:#e8e8f2;font-weight:500}
  input[type=range]{width:100%;height:3px;-webkit-appearance:none;background:#2a2a3c;border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:#7f8cff;cursor:pointer}
  .val{position:fixed;left:18px;bottom:16px;color:#5c5c70;font:12px/1.4 ui-monospace,monospace;white-space:pre}
</style></head>
<body>
<canvas id="gl"></canvas>
<div class="panel">
  <h2>云 · 调参</h2>
  <label><span>密度阈值 <b id="vThresh"></b></span><input id="thresh" type="range" min="0" max="0.7" step="0.01" value="0.30"></label>
  <label><span>纹理缩放 <b id="vScale"></b></span><input id="scale" type="range" min="0.5" max="2.5" step="0.05" value="1.05"></label>
  <label><span>明暗对比 <b id="vGamma"></b></span><input id="gamma" type="range" min="0.4" max="3" step="0.05" value="1.20"></label>
  <label><span>亮度 <b id="vBright"></b></span><input id="bright" type="range" min="0.3" max="2.5" step="0.05" value="1.30"></label>
  <label><span>色相偏移 <b id="vHue"></b></span><input id="hue" type="range" min="0" max="1" step="0.01" value="0.08"></label>
  <label><span>速度 <b id="vSpeed"></b></span><input id="speed" type="range" min="0.01" max="0.4" step="0.01" value="0.09"></label>
  <label><span>底噪透明度 <b id="vAlpha"></b></span><input id="alpha" type="range" min="0" max="0.6" step="0.01" value="0.10"></label>
  <label><span>边缘柔和 <b id="vSoft"></b></span><input id="soft" type="range" min="0.4" max="4" step="0.05" value="1.05"></label>
  <label><span>扭曲强度 <b id="vWarp"></b></span><input id="warp" type="range" min="0.5" max="3.5" step="0.05" value="2.4"></label>
</div>
<div class="val" id="dump"></div>
<script>
(function () {
  var canvas = document.getElementById("gl");
  var gl = canvas.getContext("webgl", { antialias: false, alpha: false });
  if (!gl) { document.body.style.background = "#0a1020"; return; }
  var VS = "attribute vec2 aPos; varying vec2 vUv;\n" +
    "void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }";
  var FS = "precision highp float;\nuniform float uTime, uScale, uThresh, uGamma, uBright, uHue, uSpeed, uAlpha, uSoft, uWarp;\nuniform vec2 uRes;\nvarying vec2 vUv;\n\nfloat hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }\nfloat noise(vec2 p){\n  vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);\n  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y);\n}\nfloat fbm(vec2 p){\n  float v=0.0,a=0.5;\n  for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.03; a*=0.5; }\n  return v;\n}\nvec2 toP(){ return (vUv - 0.5) * vec2(uRes.x/uRes.y, 1.0); }\nvec3 tri(float t){\n  t = fract(t) * 3.0;\n  vec3 c0 = vec3(0.40, 0.90, 1.00);\n  vec3 c1 = vec3(0.12, 0.34, 1.00);\n  vec3 c2 = vec3(0.56, 0.30, 0.98);\n  if (t < 1.0) return mix(c0, c1, t);\n  if (t < 2.0) return mix(c1, c2, t - 1.0);\n  return mix(c2, c0, t - 2.0);\n}\nfloat density(vec2 p, float t){\n  vec2 q;\n  q.x = fbm(p * 0.85 + vec2(0.0, t * 0.30));\n  q.y = fbm(p * 0.85 + vec2(t * 0.26, 0.0));\n  vec2 r;\n  r.x = fbm(p + uWarp * q + vec2(1.7, 9.2) + t * 0.14);\n  r.y = fbm(p + uWarp * q + vec2(8.3, 2.8) - t * 0.12);\n  float f = fbm(p * uScale + uWarp * 1.3 * r);\n  return clamp((f - uThresh) / max(1.0 - uThresh, 0.001), 0.0, 1.0);\n}\nvec3 shade(vec2 p, float t){\n  float d = density(p, t);\n  float s = pow(d, uGamma);\n  float k = uHue + d * 0.55 + 0.08 * sin(t * 0.40);\n  vec3 tint = tri(k);\n  vec3 col = tint * (0.12 + s * uBright);\n  col += vec3(1.0) * pow(s, 6.0) * 0.22;\n  col += tri(k + 0.30) * pow(s, 3.0) * 0.30;\n  return col;\n}\nvoid main(){\n  vec2 p = toP();\n  float t = uTime * uSpeed;\n  p *= 1.0 + 0.035 * sin(t * 0.4);\n  vec3 c = shade(p, t);\n  c += shade(p + vec2(0.005, 0.0), t);\n  c += shade(p - vec2(0.005, 0.0), t);\n  c += shade(p + vec2(0.0, 0.005), t);\n  c += shade(p - vec2(0.0, 0.005), t);\n  c /= 5.0;\n  float d = density(p, t);\n  float vig = smoothstep(1.35, 0.10, length(p * vec2(0.85, 1.0)));\n  float a = clamp(uAlpha + pow(d, uSoft) * (1.0 - uAlpha), 0.0, 1.0) * (0.35 + 0.65 * vig);\n  gl_FragColor = vec4(c * a, a);\n}";
  function compile(t, s) {
    var sh = gl.createShader(t);
    gl.shaderSource(sh, s); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error("SHADER " + gl.getShaderInfoLog(sh));
    return sh;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var ids = ["thresh","scale","gamma","bright","hue","speed","alpha","soft","warp"];
  var uni = {};
  ids.forEach(function (id) {
    uni[id] = gl.getUniformLocation(prog, id === "thresh" ? "uThresh" : "u" + id.charAt(0).toUpperCase() + id.slice(1));
  });
  var uTime = gl.getUniformLocation(prog, "uTime");
  var uRes = gl.getUniformLocation(prog, "uRes");

  var vals = {};
  function readAll() {
    ids.forEach(function (id) {
      var el = document.getElementById(id);
      vals[id] = parseFloat(el.value);
      var lab = document.getElementById("v" + id.charAt(0).toUpperCase() + id.slice(1));
      if (lab) lab.textContent = vals[id].toFixed(2);
    });
    document.getElementById("dump").textContent =
      JSON.stringify(vals, null, 0).replace(/","/g, '", "');
  }
  ids.forEach(function (id) { document.getElementById(id).addEventListener("input", readAll); });
  readAll();

  function resize() {
    var dpr = Math.min(devicePixelRatio || 1, 1.5);
    canvas.width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    canvas.height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener("resize", resize);
  resize();

  var t0 = performance.now();
  function frame() {
    gl.uniform1f(uTime, (performance.now() - t0) / 1000);
    gl.uniform2f(uRes, canvas.clientWidth, canvas.clientHeight);
    gl.uniform1f(uni.thresh, vals.thresh);
    gl.uniform1f(uni.scale, vals.scale);
    gl.uniform1f(uni.gamma, vals.gamma);
    gl.uniform1f(uni.bright, vals.bright);
    gl.uniform1f(uni.hue, vals.hue);
    gl.uniform1f(uni.speed, vals.speed);
    gl.uniform1f(uni.alpha, vals.alpha);
    gl.uniform1f(uni.soft, vals.soft);
    gl.uniform1f(uni.warp, vals.warp);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body></html>
